<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Background upload example</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
  </head>
  <body style="font-family: -apple-system, sans-serif; padding: env(safe-area-inset-top) 12px 12px">
    <main>
      <h1>Background upload</h1>
      <p>Driven by <code>test-server.mjs</code>: see the example app's README.</p>
      <button onclick="uploadNow()">Upload 4 MB</button>
      <label><input type="checkbox" id="ack" checked /> acknowledge events</label>
      <pre id="log" style="white-space: pre-wrap; font-size: 11px"></pre>
    </main>
    <script src="./js/example.js" type="module"></script>
  </body>
</html>
